<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Axy-Router</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090c;color:#f5f7fa;font:15px system-ui,-apple-system,sans-serif}
    main{width:min(92vw,520px);padding:32px;border:1px solid #252932;border-radius:24px;background:#101217;box-shadow:0 24px 80px #0008}
    .brand{font-size:34px;font-weight:800;letter-spacing:-1px}
    .sub{color:#9da3ae;margin-top:6px}
    .model{display:inline-block;margin-top:24px;padding:8px 12px;border-radius:999px;background:#1b1f27;color:#dce2ea}
    .status{margin-top:24px;color:#7ee787}
    code{color:#c9d1d9}
  </style>
</head>
<body>
  <main>
    <div class="brand">Axy-Router</div>
    <div class="sub">Lightweight AI gateway on Netlify Edge</div>
    <div class="model">Axynity-M1</div>
    <div class="status">● Online</div>
    <p>OpenAI: <code>/v1/chat/completions</code></p>
    <p>Anthropic: <code>/v1/messages</code></p>
  </main>
</body>
</html>
